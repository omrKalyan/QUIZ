<script>
const questions = [
    {
        q: "A developer wants to create a Pod that runs a single container using the nginx image but needs to ensure the Pod is automatically recreated if the node fails. What is the best practice?",
        options: { A: "Create a static Pod by placing the YAML in the kubelet manifest folder.", B: "Create a ReplicaSet with a single replica.", C: "Create a Deployment with replicas: 1.", D: "Use kubectl run nginx --image=nginx --restart=Never." },
        correct: "C",
        analysis: "OPTION A: Static pods are node-specific and not managed by the control plane. OPTION B: While a ReplicaSet works, Deployments are the production standard. OPTION C: Correct. Deployments ensure desired state across the cluster. OPTION D: This creates a bare Pod, which is not rescheduled if the node fails."
    },
    {
        q: "You are troubleshooting a Pod named web-server that is in CrashLoopBackOff. You need to see the logs from the previous instance of the container. Which command do you use?",
        options: { A: "kubectl logs web-server --previous", B: "kubectl describe pod web-server", C: "kubectl get events --watch", D: "kubectl logs web-server -f" },
        correct: "A",
        analysis: "OPTION A: Correct. The --previous (or -p) flag retrieves logs from the crashed instance. OPTION B: Shows status/events but not app logs. OPTION C: Shows scheduling issues, not app errors. OPTION D: Only follows the *current* running container."
    },
    {
        q: "A Pod requires an environment variable DB_URL derived from a ConfigMap named db-config which has a key url. Which snippet is correct?",
        options: { A: "envFrom: configMapRef: name: db-config", B: "env: - name: DB_URL; valueFrom: configMapKeyRef: {name: db-config, key: url}", C: "env: - name: DB_URL; value: configMap: db-config: url", D: "env: - name: DB_URL; configMap: db-config" },
        correct: "B",
        analysis: "OPTION A: Imports all keys, not one mapped to a specific name. OPTION B: Correct syntax for mapping a specific key to a custom name. OPTION C: Incorrect syntax; 'value' is for literal strings. OPTION D: Missing 'valueFrom' and 'configMapKeyRef' wrappers."
    },
    {
        q: "You need to implement a 'Sidecar' pattern where a second container processes logs generated by the main application container. How should they share the log file?",

        correct: "B",
        analysis: "OPTION A: HostPath is insecure and node-dependent. OPTION B: Correct. emptyDir is shared between all containers in a Pod. OPTION C: Unnecessarily complex networking. OPTION D: ConfigMaps are read-only; logs need write access."
    },
    {
        q: "An Init Container is defined in your Pod. What happens if the Init Container fails with an exit code of 1?",

        correct: "C",
        analysis: "OPTION A: Main containers never start until Init containers finish successfully. OPTION B: Completed is only for success (0). OPTION C: Correct. K8s will restart Init containers until success. OPTION D: Init containers cannot be skipped."
    },
    {
        q: "You have a node with a taint disk=full:NoSchedule. You want to deploy a Pod that can bypass this. What should you add to the Pod spec?",
        options: { A: "A nodeSelector for disk=full.", B: "An affinity rule with requiredDuringSchedulingIgnoredDuringExecution.", C: "A toleration with key disk, operator Equal, value full, and effect NoSchedule.", D: "A label disk=full to the Pod." },
        correct: "C",
        analysis: "OPTION A: Selectors attract pods, but don't bypass taints. OPTION B: Affinity doesn't override taints. OPTION C: Correct. Tolerations allow a Pod to settle on a tainted node. OPTION D: Labels do not affect taints."
    },
    {
        q: "You want to ensure that Pods of 'App-A' are never scheduled on the same node as Pods of 'App-B' for high availability. What should you use?",

        correct: "B",
        analysis: "OPTION A: Attracts pods to specific node labels. OPTION B: Correct. Prevents co-location based on other pods' labels. OPTION C: Repels all pods without tolerations. OPTION D: Limits total namespace consumption."
    },
    {
        q: "A Pod is in Pending state. kubectl describe shows '0/3 nodes are available: 3 Insufficient cpu.' What is the cause?",

        analysis: "OPTION A: Services don't affect scheduling. OPTION B: Correct. Scheduler uses 'Requests' to find a node with enough unallocated CPU. OPTION C: Scheduling is node-specific, not cluster-wide. OPTION D: The error message itself proves the scheduler is working."
    },
    {

    {

function loadQuiz() {
    const container = document.getElementById('quiz-container');
    const nav = document.getElementById('nav-dots');
    
    questions.forEach((q, index) => {
        // Create Navigation Dot
        const dot = document.createElement('a');
        dot.className = 'nav-dot';
        dot.href = `#q${index}`;
        dot.id = `dot-${index}`;
        dot.innerText = index + 1;
        nav.appendChild(dot);

        // Create Question Card
        const qDiv = document.createElement('div');
        qDiv.className = 'question-card';
        qDiv.id = `q${index}`;
        qDiv.innerHTML = `
            <div class="question-text">${index + 1}. ${q.q}</div>
            ${Object.entries(q.options).map(([key, val]) => `
                <label class="option">
                    <input type="radio" name="q${index}" value="${key}" onclick="showAnalysis(${index}, '${key}')">
                    (${key}) ${val}
                </label>
            `).join('')}
            <div id="analysis-${index}" class="analysis"></div>
        `;
        container.appendChild(qDiv);
    });
}

function showAnalysis(qIndex, selected) {
    const analysisDiv = document.getElementById(`analysis-${qIndex}`);
    const dot = document.getElementById(`dot-${qIndex}`);
    const q = questions[qIndex];
    
    analysisDiv.style.display = 'block';
    dot.classList.add('answered');
    
    analysisDiv.innerHTML = `
        <span class="correct-label">CORRECT ANSWER: (${q.correct})</span>
        <p><strong>DISTRACTOR ANALYSIS:</strong></p>
        <p>${q.analysis.replace(/OPTION/g, '<br><strong>OPTION</strong>')}</p>
    `;
}

window.onload = loadQuiz;
</script>
</body>
